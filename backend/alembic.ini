# Alembic configuration for LivePhoto backend.
# The database URL is intentionally NOT set here: env.py loads it from application settings
# (DATABASE_URL) so migrations and the application share one configuration source.

[alembic]
script_location = alembic
prepend_sys_path = .
# sqlalchemy.url is resolved by alembic/env.py from app settings.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S