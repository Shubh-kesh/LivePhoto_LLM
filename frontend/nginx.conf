# Frontend static server (nginx, non-root) — M5.6 §51-55.
#
# Serves the built SPA with SPA fallback so /capture and /dev/vlm-experiment work on direct
# refresh. Runtime-config.js is generated by the entrypoint from LIVEPHOTO_* env vars.
#
# CSP connect-src is templated at container start (see docker-entrypoint.sh) from the runtime
# API base URL, so the browser can reach the API origin without broadly relaxing CSP.

worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  gzip on;

  server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(self), microphone=()" always;
    add_header Content-Security-Policy "__CSP__" always;

    location /runtime-config.js {
      try_files $uri =404;
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Same-origin M5.8 topology: proxy backend API + launch redemption to FastAPI.
    location /xbiz/live_photo/l/ {
      proxy_pass http://backend:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
      proxy_pass http://backend:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      client_max_body_size 20m;
    }

    # SPA fallback: serve index.html for client routes (incl. /xbiz/live_photo/) on direct refresh.
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
